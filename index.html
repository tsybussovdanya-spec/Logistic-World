<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Logix Global</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <!-- Фоновый аудиоэлемент -->
    <audio id="bg-music" loop src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf756.mp3?filename=lofi-study-112191.mp3"></audio>

    <!-- Фоны -->
    <div id="parallax-bg" class="parallax-bg"></div>
    <div class="cyber-glow-bg"></div>

    <!-- Загрузочный экран -->
    <div id="loading-screen" class="loading-screen">
        <div class="loader-content">
            <h2 class="loader-title">LOGIX GLOBAL</h2>
            <div class="progress-bar-container">
                <div id="loader-progress" class="progress-bar-fill"></div>
            </div>
            <div id="loader-percent" class="loader-percent">0%</div>
            <div id="loader-tap" class="loader-tip" style="display:none; cursor:pointer;">Нажми, чтобы начать</div>
        </div>
    </div>

    <!-- Уведомления и ИИ -->
    <div id="toast-container" class="toast-container"></div>
    <div id="ai-dispatcher" class="ai-dispatcher">
        <div class="ai-avatar">🤖</div>
        <div id="ai-message" class="ai-message"></div>
    </div>

    <!-- Основное приложение -->
    <div id="app-content" class="app-container" style="opacity: 0; transition: opacity 0.5s;">
        
        <!-- Шапка -->
        <header class="app-header">
            <div class="user-profile-preview">
                <div class="avatar-wrapper">
                    <div class="avatar-small" style="display:flex; justify-content:center; align-items:center;">👤</div>
                </div>
                <div class="user-info">
                    <div class="name-row">
                        <span id="username" class="premium-name">Игрок</span>
                        <span id="user-level-badge" class="level-badge">LVL 1</span>
                    </div>
                </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 5px; align-items: flex-end;">
                <div class="balance-container">
                    <span id="user-money" class="badge-money">🪙 0</span>
                    <span id="user-fuel-stock" class="badge-fuel">⛽ 0л</span>
                </div>
                <div class="xp-bar-container" style="width: 100px;">
                    <div id="xp-bar-fill" class="xp-bar-fill"></div>
                </div>
            </div>
        </header>

        <!-- Контент вкладок -->
        <main class="content-area">
            
            <!-- Вкладка: Автопарк -->
            <section id="tab-fleet" class="tab-content active">
                <div class="section-header" style="display: flex; justify-content: space-between; align-items: center;">
                    <div>
                        <h2>Автопарк</h2>
                        <div class="subtitle">Управляй своими фурами</div>
                    </div>
                    <button class="btn btn-primary" style="width: auto; padding: 8px 12px; font-size: 12px;" onclick="GameLogic.claimDailyBonus()">🎁 Бонус</button>
                </div>
                
                <div id="active-trip-panel" class="card-grid" style="margin-bottom: 16px;">
                    <!-- Активный рейс -->
                </div>

                <div class="subsection-title">Ваши автомобили</div>
                <div class="card-grid" id="fleet-list">
                    <!-- Динамический рендер автопарка -->
                </div>
            </section>

            <!-- Вкладка: Биржа и Контракты -->
            <section id="tab-contracts" class="tab-content">
                <div class="section-header">
                    <h2>Биржа</h2>
                    <div class="subtitle">Погода: <span id="weather-info" class="weather-badge">☀️ Ясно</span></div>
                </div>

                <div class="stats-grid" style="margin-bottom: 16px;">
                    <div class="stat-box">
                        <span class="stat-label">Цена топлива</span>
                        <span id="fuel-price" class="stat-value">🪙 12 / л</span>
                    </div>
                    <button class="btn btn-outline" style="height: 100%;" onclick="GameLogic.buyFuel(100)">Купить 100л</button>
                </div>

                <div class="subsection-title">Доступные контракты</div>
                <div id="contracts-list" class="card-grid">
                    <!-- Динамический рендер контрактов -->
                </div>
            </section>

            <!-- Вкладка: Профиль -->
            <section id="tab-profile" class="tab-content">
                <div class="section-header">
                    <h2>Профиль</h2>
                    <div class="subtitle">Корпорация: <span id="corp-name">Нет</span></div>
                </div>

                <div class="stats-grid" style="margin-bottom: 20px;">
                    <div class="stat-box">
                        <span class="stat-label">Заработано</span>
                        <span id="stat-total-profit" class="stat-value">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Рейсов</span>
                        <span id="stat-total-trips" class="stat-value">0</span>
                    </div>
                </div>

                <div class="subsection-title">Лицензии и допуски</div>
                <div id="licenses-list" class="licenses-row" style="flex-direction: column; gap: 10px; overflow-x: visible;">
                    <!-- Динамический рендер лицензий с кнопками покупки -->
                </div>
                
                <div class="subsection-title" style="margin-top: 24px;">Настройки</div>
                <div class="stats-grid">
                    <button id="btn-music" onclick="AudioSys.toggleMusic()" class="btn btn-outline">Музыка 🔇</button>
                    <button id="btn-sfx" onclick="AudioSys.toggleSFX()" class="btn btn-outline">Звуки 🔊</button>
                </div>
            </section>
        </main>

        <!-- Нижняя навигация -->
        <nav class="bottom-nav">
            <button class="tab-btn active" onclick="switchTab('fleet')">
                <span class="icon">🚛</span>
                Парк
            </button>
            <button class="tab-btn" onclick="switchTab('contracts')">
                <span class="icon">📋</span>
                Рейсы
            </button>
            <button class="tab-btn" onclick="switchTab('profile')">
                <span class="icon">👤</span>
                Профиль
            </button>
        </nav>
    </div>

    <script src="script.js"></script>
</body>
</html>
