<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Твоя копилка 💰</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-green: #10b981;
      --accent-red: #f43f5e;
      --accent-cyan: #06b6d4;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --theme-glow: rgba(6, 182, 212, 0.3);
    }

    /* Пресеты тем */
    body.theme-neon {
      --accent-cyan: #06b6d4;
      --theme-glow: rgba(6, 182, 212, 0.3);
    }
    body.theme-lazurit {
      --accent-cyan: #3b82f6;
      --theme-glow: rgba(59, 130, 246, 0.35);
    }
    body.theme-gold {
      --accent-cyan: #eab308;
      --theme-glow: rgba(234, 179, 8, 0.35);
    }
    body.theme-emerald {
      --accent-cyan: #10b981;
      --theme-glow: rgba(16, 185, 129, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text-main); padding: 16px; min-height: 100vh; display: flex; flex-direction: column; gap: 16px; transition: background-color 0.3s ease; }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      position: relative;
    }

    .balance-card { text-align: center; background: linear-gradient(135deg, rgba(255, 255, 255, 0.03), rgba(255, 255, 255, 0.01)); border: 1px solid var(--card-border); }
    .balance-title { font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .balance-amount { font-size: 38px; font-weight: 800; color: var(--text-main); text-shadow: 0 0 20px var(--theme-glow); transition: text-shadow 0.3s ease; }

    /* Секция цели и прогресс-бара */
    .goal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 13px; color: var(--text-muted); }
    .goal-set-btn { background: none; border: none; color: var(--accent-cyan); font-size: 13px; font-weight: 600; cursor: pointer; }
    .progress-track { width: 100%; height: 12px; background: rgba(255, 255, 255, 0.08); border-radius: 10px; overflow: hidden; position: relative; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green)); width: 0%; transition: width 0.4s ease, background 0.3s ease; border-radius: 10px; }
    .goal-info { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: var(--text-muted); }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-item { text-align: center; padding: 14px; }
    .stat-value { font-size: 18px; font-weight: 700; margin-top: 4px; }
    .stat-value.neutral { color: var(--accent-cyan); transition: color 0.3s ease; }

    /* Выбор кастомизации */
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .section-label { font-size: 13px; color: var(--text-muted); font-weight: 600; }
    .sound-toggle-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--card-border); color: var(--text-main); padding: 4px 10px; border-radius: 10px; font-size: 12px; cursor: pointer; }
    
    .custom-row { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; }
    .theme-chip {
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      font-size: 12px;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .theme-chip.active { border-color: var(--accent-cyan); color: #fff; font-weight: 600; background: rgba(255, 255, 255, 0.1); }
    .icon-btn {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .icon-btn.active { border-color: var(--accent-cyan); background: rgba(255, 255, 255, 0.15); transform: scale(1.05); }

    /* Выбор тегов */
    .tags-container { display: flex; gap: 8px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 4px; }
    .tag-chip {
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      font-size: 13px;
      color: var(--text-muted);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .tag-chip.active { border-color: var(--accent-cyan); color: #fff; font-weight: 600; background: rgba(255, 255, 255, 0.1); }

    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .input-group { margin-bottom: 12px; }
    input[type="number"] {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      padding: 14px;
      border-radius: 14px;
      color: #fff;
      font-size: 18px;
      text-align: center;
      outline: none;
    }
    input[type="number"]:focus { border-color: var(--accent-cyan); }

    .btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-deposit { background: var(--accent-green); color: #000; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
    .btn-withdraw { background: var(--accent-red); color: #fff; box-shadow: 0 4px 15px rgba(244, 63, 94, 0.3); }
    .btn:active { transform: scale(0.97); opacity: 0.9; }

    /* История операций */
    .history-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .history-title { font-size: 16px; font-weight: 600; color: var(--text-muted); }
    .reset-all-btn { background: none; border: none; color: var(--accent-red); font-size: 12px; cursor: pointer; opacity: 0.8; }

    .history-list { display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto; }
    .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: rgba(255, 255, 255, 0.02); border-radius: 10px; font-size: 14px; }
    .history-left { display: flex; flex-direction: column; gap: 2px; }
    .history-tag { font-size: 11px; color: var(--text-muted); }
    .history-right { display: flex; align-items: center; gap: 10px; }
    .delete-item-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 14px; padding: 2px; }
    .delete-item-btn:active { color: var(--accent-red); }
    .empty-history { text-align: center; color: var(--text-muted); font-size: 14px; padding: 10px; }
  </style>
</head>
<body class="theme-neon">

  <div class="glass-card balance-card">
    <div class="balance-title">
      <span id="piggyIcon">💰</span> Накоплено всего
    </div>
    <div class="balance-amount" id="totalBalance">0 ₸</div>
  </div>

  <!-- Карточка целей -->
  <div class="glass-card">
    <div class="goal-header">
      <span>Цель накопления</span>
      <button class="goal-set-btn" onclick="setGoal()">Изменить цель</button>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="goal-info">
      <span id="goalPercent">0%</span>
      <span id="goalTarget">Цель: 100,000 ₸</span>
    </div>
  </div>

  <div class="stats-grid">
    <div class="glass-card stat-item">
      <div class="balance-title">За неделю</div>
      <div class="stat-value neutral" id="weekBalance">+0 ₸</div>
    </div>
    <div class="glass-card stat-item">
      <div class="balance-title">За месяц</div>
      <div class="stat-value neutral" id="monthBalance">+0 ₸</div>
    </div>
  </div>

  <!-- Блок кастомизации -->
  <div class="glass-card">
    <div class="section-header">
      <div class="section-label">🎨 Стиль и эффекты</div>
      <button class="sound-toggle-btn" id="soundToggleBtn" onclick="toggleSound()">🔊 Звук: Вкл</button>
    </div>
    <div class="custom-row" id="themesRow">
      <div class="theme-chip active" onclick="setTheme('neon', this)">🩵 Neon</div>
      <div class="theme-chip" onclick="setTheme('lazurit', this)">💎 Lazurit</div>
      <div class="theme-chip" onclick="setTheme('gold', this)">👑 Gold</div>
      <div class="theme-chip" onclick="setTheme('emerald', this)">🌿 Emerald</div>
    </div>

    <div class="section-label" style="margin-bottom: 8px;">Иконка копилки</div>
    <div class="custom-row" id="iconsRow">
      <button class="icon-btn active" onclick="setIcon('💰', this)">💰</button>
      <button class="icon-btn" onclick="setIcon('🐷', this)">🐷</button>
      <button class="icon-btn" onclick="setIcon('💎', this)">💎</button>
      <button class="icon-btn" onclick="setIcon('🚀', this)">🚀</button>
      <button class="icon-btn" onclick="setIcon('👑', this)">👑</button>
    </div>
  </div>

  <div class="glass-card">
    <!-- Выбор тегов -->
    <div class="tags-container" id="tagsContainer">
      <div class="tag-chip active" onclick="selectTag('Другое', this)">💡 Другое</div>
      <div class="tag-chip" onclick="selectTag('Зарплата', this)">💼 Зарплата</div>
      <div class="tag-chip" onclick="selectTag('Подарок', this)">🎁 Подарок</div>
      <div class="tag-chip" onclick="selectTag('Еда', this)">🍔 Еда</div>
    </div>

    <div class="input-group">
      <input type="number" id="amountInput" placeholder="Введите сумму" inputmode="decimal">
    </div>
    <div class="actions">
      <button class="btn btn-deposit" onclick="addTransaction('deposit')">+ Положил</button>
      <button class="btn btn-withdraw" onclick="addTransaction('withdraw')">- Забрал</button>
    </div>
  </div>

  <div class="glass-card">
    <div class="history-header">
      <div class="history-title">Последние операции</div>
      <button class="reset-all-btn" onclick="resetAllData()">Очистить всё</button>
    </div>
    <div class="history-list" id="historyList"></div>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { 
      tg.ready(); 
      tg.expand(); 
    }

    let selectedTag = 'Другое';
    let isSoundEnabled = localStorage.getItem('piggy_sound') !== 'false';

    // --- SFX (Звуковой движок Web Audio API) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSFX(type) {
      if (!isSoundEnabled) return;
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      const now = audioCtx.currentTime;

      if (type === 'deposit') {
        // Звон пополнения (двухтоновый чип)
        const osc1 = audioCtx.createOscillator();
        const osc2 = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc1.type = 'sine';
        osc2.type = 'triangle';

        osc1.frequency.setValueAtTime(587.33, now); // D5
        osc1.frequency.exponentialRampToValueAtTime(880, now + 0.15); // A5

        osc2.frequency.setValueAtTime(1174.66, now + 0.05); // D6

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);

        osc1.connect(gain);
        osc2.connect(gain);
        gain.connect(audioCtx.destination);

        osc1.start(now);
        osc2.start(now + 0.05);
        osc1.stop(now + 0.3);
        osc2.stop(now + 0.3);

      } else if (type === 'withdraw') {
        // Звук снятия (падающий тон)
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(220, now + 0.2);

        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.2);

      } else if (type === 'click') {
        // Легкий щелчок интерфейса
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(400, now + 0.04);

        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.04);

      } else if (type === 'error') {
        // Звук ошибки
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(150, now);
        osc.frequency.setValueAtTime(110, now + 0.1);

        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.start(now);
        osc.stop(now + 0.25);
      }
    }

    function toggleSound() {
      isSoundEnabled = !isSoundEnabled;
      localStorage.setItem('piggy_sound', isSoundEnabled);
      updateSoundBtn();
      if (isSoundEnabled) playSFX('click');
    }

    function updateSoundBtn() {
      const btn = document.getElementById('soundToggleBtn');
      btn.innerText = isSoundEnabled ? '🔊 Звук: Вкл' : '🔇 Звук: Выкл';
    }

    // --- Загрузка и управление темой ---
    function applySavedTheme() {
      const savedTheme = localStorage.getItem('piggy_theme') || 'neon';
      const savedIcon = localStorage.getItem('piggy_icon') || '💰';
      
      document.body.className = `theme-${savedTheme}`;
      document.getElementById('piggyIcon').innerText = savedIcon;

      document.querySelectorAll('#themesRow .theme-chip').forEach(el => {
        if (el.getAttribute('onclick').includes(`'${savedTheme}'`)) {
          el.classList.add('active');
        } else {
          el.classList.remove('active');
        }
      });

      document.querySelectorAll('#iconsRow .icon-btn').forEach(el => {
        if (el.innerText === savedIcon) {
          el.classList.add('active');
        } else {
          el.classList.remove('active');
        }
      });

      updateSoundBtn();
    }

    function setTheme(themeName, element) {
      document.body.className = `theme-${themeName}`;
      localStorage.setItem('piggy_theme', themeName);
      
      document.querySelectorAll('#themesRow .theme-chip').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      playSFX('click');
      if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
    }

    function setIcon(icon, element) {
      document.getElementById('piggyIcon').innerText = icon;
      localStorage.setItem('piggy_icon', icon);

      document.querySelectorAll('#iconsRow .icon-btn').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      playSFX('click');
      if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
    }

    function getTransactions() {
      const data = localStorage.getItem('piggy_transactions');
      return data ? JSON.parse(data) : [];
    }

    function saveTransactions(transactions) {
      localStorage.setItem('piggy_transactions', JSON.stringify(transactions));
    }

    function getGoal() {
      return parseFloat(localStorage.getItem('piggy_goal')) || 100000;
    }

    function setGoal() {
      playSFX('click');
      const current = getGoal();
      const input = prompt("Введите сумму цели в ₸:", current);
      if (input !== null) {
        const val = parseFloat(input.replace(',', '.').trim());
        if (!isNaN(val) && val > 0) {
          localStorage.setItem('piggy_goal', val);
          playSFX('deposit');
          loadData();
        } else {
          playSFX('error');
          alert("Введите корректную сумму");
        }
      }
    }

    function selectTag(tag, element) {
      selectedTag = tag;
      document.querySelectorAll('#tagsContainer .tag-chip').forEach(el => el.classList.remove('active'));
      element.classList.add('active');
      playSFX('click');
    }

    function deleteTransaction(id) {
      playSFX('click');
      if (confirm("Удалить эту запись?")) {
        let transactions = getTransactions();
        transactions = transactions.filter(t => t.id !== id);
        saveTransactions(transactions);
        playSFX('error');
        if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
        loadData();
      }
    }

    function resetAllData() {
      playSFX('click');
      if (confirm("Вы уверены, что хотите сбросить ВСЮ историю накоплений?")) {
        localStorage.removeItem('piggy_transactions');
        playSFX('error');
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('warning');
        loadData();
      }
    }

    function loadData() {
      const transactions = getTransactions();
      const targetGoal = getGoal();

      let total = 0;
      let weekTotal = 0;
      let monthTotal = 0;

      const now = new Date();
      const startOfWeek = new Date(now);
      const day = startOfWeek.getDay() || 7;
      startOfWeek.setDate(now.getDate() - day + 1);
      startOfWeek.setHours(0, 0, 0, 0);

      const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);

      const historyList = document.getElementById('historyList');
      historyList.innerHTML = '';

      if (transactions.length === 0) {
        historyList.innerHTML = '<div class="empty-history">История операций пуста</div>';
      } else {
        transactions.forEach(t => {
          const val = Number(t.amount);
          total += val;

          const date = new Date(t.created_at);
          if (date >= startOfWeek) weekTotal += val;
          if (date >= startOfMonth) monthTotal += val;
        });

        transactions.slice(0, 15).forEach(t => {
          const item = document.createElement('div');
          item.className = 'history-item';
          const isPlus = t.type === 'deposit';
          const amountVal = Math.abs(Number(t.amount)).toLocaleString();
          const tagName = t.tag || 'Другое';
          
          item.innerHTML = `
            <div class="history-left">
              <span>${isPlus ? 'Пополнение' : 'Снятие'}</span>
              <span class="history-tag">${tagName}</span>
            </div>
            <div class="history-right">
              <span style="color: ${isPlus ? 'var(--accent-green)' : 'var(--accent-red)'}">
                ${isPlus ? '+' : '-'}${amountVal} ₸
              </span>
              <button class="delete-item-btn" onclick="deleteTransaction(${t.id})">✕</button>
            </div>
          `;
          historyList.appendChild(item);
        });
      }

      // Обновление балансов
      document.getElementById('totalBalance').innerText = `${total.toLocaleString()} ₸`;
      document.getElementById('weekBalance').innerText = `${weekTotal >= 0 ? '+' : ''}${weekTotal.toLocaleString()} ₸`;
      document.getElementById('monthBalance').innerText = `${monthTotal >= 0 ? '+' : ''}${monthTotal.toLocaleString()} ₸`;

      // Расчет прогресса цели
      const percent = Math.min(Math.max(Math.round((total / targetGoal) * 100), 0), 100);
      document.getElementById('progressFill').style.width = `${percent}%`;
      document.getElementById('goalPercent').innerText = `${percent}%`;
      document.getElementById('goalTarget').innerText = `Цель: ${targetGoal.toLocaleString()} ₸`;
    }

    function addTransaction(type) {
      const input = document.getElementById('amountInput');
      const rawVal = input.value.replace(',', '.').trim();
      const val = parseFloat(rawVal);

      if (isNaN(val) || val <= 0) {
        playSFX('error');
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
        return;
      }

      const finalAmount = type === 'deposit' ? val : -val;
      const transactions = getTransactions();
      
      transactions.unshift({
        id: Date.now(),
        amount: finalAmount,
        type: type,
        tag: selectedTag,
        created_at: new Date().toISOString()
      });

      saveTransactions(transactions);

      playSFX(type);
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      
      input.value = '';
      loadData();
    }

    // Инициализация
    applySavedTheme();
    loadData();
  </script>
</body>
</html>
