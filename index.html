<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Копилка</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-green: #10b981;
      --accent-red: #f43f5e;
      --accent-cyan: #06b6d4;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: var(--bg); color: var(--text-main); padding: 16px; min-height: 100vh; display: flex; flex-direction: column; gap: 16px; }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .balance-card { text-align: center; background: linear-gradient(135deg, rgba(6, 182, 212, 0.1), rgba(16, 185, 129, 0.05)); border: 1px solid rgba(6, 182, 212, 0.2); }
    .balance-title { font-size: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
    .balance-amount { font-size: 38px; font-weight: 800; color: var(--text-main); text-shadow: 0 0 20px rgba(6, 182, 212, 0.3); }

    .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .stat-item { text-align: center; padding: 14px; }
    .stat-value { font-size: 18px; font-weight: 700; margin-top: 4px; }
    .stat-value.plus { color: var(--accent-green); }
    .stat-value.neutral { color: var(--accent-cyan); }

    .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .input-group { margin-bottom: 12px; }
    input[type="number"] {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      padding: 14px;
      border-radius: 14px;
      color: #fff;
      font-size: 18px;
      text-align: center;
      outline: none;
    }
    input[type="number"]:focus { border-color: var(--accent-cyan); }

    .btn {
      width: 100%;
      padding: 16px;
      border-radius: 14px;
      border: none;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-deposit { background: var(--accent-green); color: #000; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
    .btn-withdraw { background: var(--accent-red); color: #fff; box-shadow: 0 4px 15px rgba(244, 63, 94, 0.3); }
    .btn:active { transform: scale(0.97); opacity: 0.9; }

    .history-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: var(--text-muted); }
    .history-list { display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
    .history-item { display: flex; justify-content: space-between; padding: 10px 14px; background: rgba(255, 255, 255, 0.02); border-radius: 10px; font-size: 14px; }
  </style>
</head>
<body>

  <div class="glass-card balance-card">
    <div class="balance-title">Накоплено всего</div>
    <div class="balance-amount" id="totalBalance">0 ₸</div>
  </div>

  <div class="stats-grid">
    <div class="glass-card stat-item">
      <div class="balance-title">За неделю</div>
      <div class="stat-value neutral" id="weekBalance">+0 ₸</div>
    </div>
    <div class="glass-card stat-item">
      <div class="balance-title">За месяц</div>
      <div class="stat-value neutral" id="monthBalance">+0 ₸</div>
    </div>
  </div>

  <div class="glass-card">
    <div class="input-group">
      <input type="number" id="amountInput" placeholder="Введите сумму" inputmode="decimal">
    </div>
    <div class="actions">
      <button class="btn btn-deposit" onclick="addTransaction('deposit')">+ Положил</button>
      <button class="btn btn-withdraw" onclick="addTransaction('withdraw')">- Забрал</button>
    </div>
  </div>

  <div class="glass-card">
    <div class="history-title">Последние операции</div>
    <div class="history-list" id="historyList"></div>
  </div>

  <script>
    const SUPABASE_URL = "YOUR_SUPABASE_URL";
    const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    const userId = tg?.initDataUnsafe?.user?.id || 99999999; // Фолбэк для тестов в браузере

    async function loadData() {
      const { data: transactions, error } = await supabase
        .from('transactions')
        .select('*')
        .eq('user_id', userId)
        .order('created_at', { ascending: false });

      if (error) return console.error(error);

      let total = 0;
      let weekTotal = 0;
      let monthTotal = 0;

      const now = new Date();
      const startOfWeek = new Date(now);
      startOfWeek.setDate(now.getDate() - now.getDay());
      startOfWeek.setHours(0,0,0,0);

      const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);

      const historyList = document.getElementById('historyList');
      historyList.innerHTML = '';

      transactions.forEach(t => {
        const val = parseFloat(t.amount);
        total += val;

        const date = new Date(t.created_at);
        if (date >= startOfWeek) weekTotal += val;
        if (date >= startOfMonth) monthTotal += val;
      });

      // Отображение
      document.getElementById('totalBalance').innerText = `${total.toLocaleString()} ₸`;
      document.getElementById('weekBalance').innerText = `${weekTotal >= 0 ? '+' : ''}${weekTotal.toLocaleString()} ₸`;
      document.getElementById('monthBalance').innerText = `${monthTotal >= 0 ? '+' : ''}${monthTotal.toLocaleString()} ₸`;

      // История (первые 5)
      transactions.slice(0, 5).forEach(t => {
        const item = document.createElement('div');
        item.className = 'history-item';
        const isPlus = t.type === 'deposit';
        item.innerHTML = `
          <span>${isPlus ? 'Пополнение' : 'Снятие'}</span>
          <span style="color: ${isPlus ? 'var(--accent-green)' : 'var(--accent-red)'}">
            ${isPlus ? '+' : ''}${parseFloat(t.amount).toLocaleString()} ₸
          </span>
        `;
        historyList.appendChild(item);
      });
    }

    async function addTransaction(type) {
      const input = document.getElementById('amountInput');
      const val = parseFloat(input.value);

      if (!val || val <= 0) {
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
        return;
      }

      const amount = type === 'deposit' ? val : -val;

      const { error } = await supabase
        .from('transactions')
        .insert([{ user_id: userId, amount: amount, type: type }]);

      if (!error) {
        if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
        input.value = '';
        loadData();
      }
    }

    loadData();
  </script>
</body>
</html>
